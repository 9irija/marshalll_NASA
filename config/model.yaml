# Marswalk consumables + terrain model. Every number the planner uses lives here.
# Each parameter: value + `source` note. The UI assumptions drawer renders this file.
# Bump `version` whenever a value changes; API responses echo it as assumptions_version.
version: "2026.10.16-1"

walking:
  minetti_coeffs:
    value: [280.5, -58.7, -76.8, 51.9, 19.6, 2.5]   # i^5 .. i^0, J kg^-1 m^-1
    source: >
      Minetti et al. (2002) J Appl Physiol 93:1039-1046, energy cost of walking vs gradient i.
      Valid for -0.45 <= i <= 0.45; gradients outside are clamped to the range edge.
  gradient_clamp:
    value: 0.45
    source: Validity range of the Minetti polynomial.
  body_mass_kg:
    value: 80
    source: Team assumption, crew member nude mass.
  suit_mass_kg:
    value: 70
    source: >
      Team assumption for a planetary suit + life-support backpack. Order of magnitude of
      NASA exploration-suit studies; not a specific suit.
  gravity_metabolic_factor:
    value: 0.55
    source: >
      Team assumption. Reduced-gravity walking studies (e.g. Farley & McMahon 1992,
      J Appl Physiol 73:2709) show metabolic cost falls less than proportionally with
      gravity; we scale Earth cost by 0.55 at Mars 0.38 g. Approximation, not a fit.
  suit_penalty:
    value: 1.3
    source: >
      Team assumption, multiplier for pressurised-suit joint torque and gait changes.
      Exposed so judges can test sensitivity.
  baseline_metabolic_w:
    value: 100
    source: Resting metabolic rate of an adult (~100 W), applied for every second of EVA.
  science_stop_metabolic_w:
    value: 200
    source: Team assumption, light work (sampling, imaging) at a science stop.
  science_stop_min:
    value: 20
    source: Team assumption, dwell time at each science target.

speed:
  tobler_peak_kmh:
    value: 6.0
    source: Tobler (1993) hiking function, v = 6 exp(-3.5 |s + 0.05|) km/h, s = dh/dx.
  suit_speed_factor:
    value: 0.55
    source: >
      Team assumption. Apollo lunar EVA traverses were slower than Earth hiking speeds;
      scales Tobler to ~2.8 km/h on flat ground.
  min_speed_ms:
    value: 0.10
    source: Floor to keep steep-but-passable cells finite.

terrain:
  max_slope_deg:
    value: 25
    source: >
      Hard cutoff above which a cell is impassable. Team assumption for a suited crew
      member on loose regolith; configurable.
  roughness_weight:
    value: 0.6
    source: Team assumption. Cost multiplier = 1 + roughness_weight * roughness_norm.
  hazard_weight_safest:
    value: 4.0
    source: Team assumption. Extra multiplier on rock hazard used only by the "safest" objective.
  roughness_window_m:
    value: 6
    source: Window for local std-dev of detrended elevation (roughness).

oxygen:
  kj_per_litre_o2:
    value: 20.1
    source: Energy equivalent of oxygen at RQ ~0.82 (~4.8 kcal/L), standard physiology value.
  o2_density_kg_m3:
    value: 1.429
    source: Density of O2 at STP.
  initial_o2_kg:
    value: 0.60
    source: Team assumption, usable primary O2 for an 8 h class EVA suit.
  reserve_frac:
    value: 0.15
    source: Team assumption, O2 that must remain on arrival at the habitat.

battery:
  capacity_wh:
    value: 800
    source: Team assumption, suit battery usable energy.
  suit_baseline_w:
    value: 90
    source: Team assumption, fans, pump, controller, displays.
  comms_w:
    value: 10
    source: Team assumption, suit radio.
  heater_w:
    value: 0
    source: Team assumption, off by default; raised by cold-case scenarios.
  reserve_frac:
    value: 0.15
    source: Team assumption, energy that must remain on arrival at the habitat.

eva:
  max_duration_h:
    value: 8
    source: Planning horizon of the timeline and envelope animation.
  envelope_timestep_s:
    value: 300
    source: Envelope frame interval (5 min), per the planning brief.

hazards:
  dust_storm:
    speed_mult:
      value: 0.7
      source: Team assumption, reduced visibility slows walking.
    extra_power_w:
      value: 25
      source: Team assumption, extra heater/fan load in dust.
    extra_reserve_frac:
      value: 0.10
      source: Team assumption, flight rule adds reserve under degraded conditions.
  suit_fault:
    o2_leak_kg_per_h:
      value: 0.05
      source: Team assumption, slow leak scenario.
    extra_reserve_frac:
      value: 0.05
      source: Team assumption.

science:
  weights:
    value: {olivine: 1.0, fe_mg_smectite: 1.2, carbonate: 1.5, hydration: 1.0}
    source: >
      Team assumption. Mars 2020 priorities (aqueous alteration, carbonates for
      biosignature preservation) weighted above primary igneous minerals.
  candidate_count:
    value: 40
    source: Number of science hotspots offered to the orienteering solver.
  min_spacing_m:
    value: 120
    source: Minimum spacing between science hotspots.
