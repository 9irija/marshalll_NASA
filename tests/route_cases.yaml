# Fixed planner cases for /check-route (scripts/check_routes.py) and tests/test_route_cases.py.
# Expectations are guard rails, not exact values: they catch regressions in the
# cost model, search or data without pinning numbers that legitimately change
# when model.yaml is tuned.
cases:
  - id: wildcat_4h
    targets: [wildcat_ridge]
    params: {max_duration_s: 14400}
    expect: {feasible: true, max_slope_deg_le: 25, distance_km_between: [5.0, 9.0]}
  - id: seitah_4h
    targets: [seitah]
    params: {max_duration_s: 14400}
    expect: {feasible: true, max_slope_deg_le: 25, distance_km_between: [1.2, 3.5]}
  - id: three_forks_4h
    targets: [three_forks]
    params: {max_duration_s: 14400}
    expect: {feasible: true, max_slope_deg_le: 25}
  - id: skinner_dust
    targets: [skinner_ridge]
    hazard: dust_storm
    params: {max_duration_s: 14400}
    expect: {max_slope_deg_le: 25}
  - id: wildcat_too_short
    # 2 h is not enough to reach the delta front and return: must be flagged infeasible
    targets: [wildcat_ridge]
    params: {max_duration_s: 7200}
    expect: {feasible: false}
  - id: tiny_o2
    # with 0.15 kg of O2 the delta front is out of reach: a point of no return must appear
    targets: [wildcat_ridge]
    params: {initial_o2_kg: 0.15, max_duration_s: 28800}
    expect: {feasible: false, pnr: true}
validation:
  - {sol_from: 389, sol_to: 415, expect: {mean_deviation_m_le: 250, frechet_m_le: 600}}
