app = "marswalk-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CLAUDE_MODEL = "claude-sonnet-5-5"
  WEB_ORIGINS = "https://marswalk.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "2gb"
  cpus = 2
